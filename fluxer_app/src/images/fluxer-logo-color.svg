<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#0D1F0D"/>
  <!-- Nucleus -->
  <circle cx="256" cy="256" r="28" fill="#39D353"/>
  <!-- Electron orbit 1 -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#39D353" stroke-width="12"/>
  <!-- Electron orbit 2 (rotated 60deg) -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#39D353" stroke-width="12" transform="rotate(60 256 256)"/>
  <!-- Electron orbit 3 (rotated 120deg) -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#39D353" stroke-width="12" transform="rotate(120 256 256)"/>
  <!-- Electrons -->
  <circle cx="76" cy="256" r="16" fill="#39D353"/>
  <circle cx="346" cy="108" r="16" fill="#39D353"/>
  <circle cx="346" cy="404" r="16" fill="#39D353"/>
</svg>
