<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1200 512">
  <!-- Atom logo (left side, same as monochrome logo) -->
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="currentColor" opacity="0.12"/>
  <!-- Nucleus -->
  <circle cx="256" cy="256" r="28" fill="currentColor"/>
  <!-- Electron orbit 1 -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="currentColor" stroke-width="12"/>
  <!-- Electron orbit 2 (rotated 60deg) -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="currentColor" stroke-width="12" transform="rotate(60 256 256)"/>
  <!-- Electron orbit 3 (rotated 120deg) -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="currentColor" stroke-width="12" transform="rotate(120 256 256)"/>
  <!-- Electrons -->
  <circle cx="76" cy="256" r="16" fill="currentColor"/>
  <circle cx="346" cy="108" r="16" fill="currentColor"/>
  <circle cx="346" cy="404" r="16" fill="currentColor"/>
  <!-- Wordmark text -->
  <text
    x="560"
    y="310"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="148"
    font-weight="700"
    letter-spacing="-2"
    fill="currentColor"
  >Atomic Radius</text>
</svg>
