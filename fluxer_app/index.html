<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomic Radius</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Atomic Radius — private messaging for your inner circle.">
<link rel="preconnect" href="https://fluxerstatic.com">
<link rel="stylesheet" href="https://fluxerstatic.com/fonts/ibm-plex.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/web/favicon.svg?v=atomic-radius-2">
<link rel="icon" type="image/png" sizes="32x32" href="/web/favicon-32x32.png?v=atomic-radius-2">
<link rel="icon" type="image/png" sizes="16x16" href="/web/favicon-16x16.png?v=atomic-radius-2">
<link rel="apple-touch-icon" sizes="180x180" href="/web/apple-touch-icon.png?v=atomic-radius-2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atomic Radius">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#39D353">
<meta name="msapplication-navbutton-color" content="#39D353">
<meta name="msapplication-TileColor" content="#39D353">
<meta name="msapplication-config" content="/browserconfig.xml">
<meta name="format-detection" content="telephone=no">
<meta name="display" content="standalone">
<style>
	html,
	body,
	#root {
		min-height: 100%;
	}

	body {
		margin: 0;
		background: #171b21;
		color: #f4f7fb;
		font-family: "IBM Plex Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	}

	.initial-shell {
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		box-sizing: border-box;
		padding: 32px;
		text-align: center;
	}

	.initial-shell__content {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 18px;
		max-width: 360px;
	}

	.initial-shell__mark {
		width: 96px;
		height: 96px;
		display: block;
		filter: drop-shadow(0 14px 36px rgb(57 211 83 / 0.22));
	}

	.initial-shell__title {
		margin: 0;
		font-size: 28px;
		line-height: 1.1;
		font-weight: 700;
		letter-spacing: 0;
	}

	.initial-shell__status {
		margin: 0;
		color: #b8c2cc;
		font-size: 15px;
		line-height: 1.5;
	}

	.initial-shell__fallback {
		display: none;
		margin: 0;
		color: #8da0b3;
		font-size: 13px;
		line-height: 1.5;
	}

	.initial-shell--delayed .initial-shell__fallback {
		display: block;
	}

	.initial-shell__links {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: 10px 16px;
	}

	.initial-shell__links a {
		color: #58a6ff;
		font-size: 13px;
		text-decoration: none;
	}

	.initial-shell__links a:hover {
		text-decoration: underline;
	}

	.initial-shell__orbit {
		fill: none;
		stroke: #ffffff;
		stroke-width: 4.5;
	}

	.initial-shell__nucleus {
		fill: #ffffff;
	}

	@media (max-width: 480px) {
		.initial-shell {
			padding: 24px;
		}

		.initial-shell__mark {
			width: 80px;
			height: 80px;
		}

		.initial-shell__title {
			font-size: 24px;
		}
	}
</style>
<script nonce="{{CSP_NONCE_PLACEHOLDER}}">(function(){try{var loc=window.location;if(loc.pathname==='/'){var target='/channels/@me';if(loc.search)target+=loc.search;if(loc.hash)target+=loc.hash;loc.replace(target);}}catch(e){}})();</script>
<script nonce="{{CSP_NONCE_PLACEHOLDER}}">(function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.classList.add('theme-'+t)}}catch(e){}})()</script>
<script nonce="{{CSP_NONCE_PLACEHOLDER}}">(function(){try{window.setTimeout(function(){var shell=document.getElementById('initial-shell');if(shell){shell.classList.add('initial-shell--delayed');}},12000);}catch(e){}})();</script>
</head>
<body>
<div id="root">
	<div id="initial-shell" class="initial-shell" role="status" aria-live="polite">
		<div class="initial-shell__content">
			<svg class="initial-shell__mark" viewBox="0 0 128 128" role="img" aria-labelledby="initial-shell-logo-title">
				<title id="initial-shell-logo-title">Atomic Radius</title>
				<circle cx="64" cy="64" r="58" fill="#39D353" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" transform="rotate(60 64 64)" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" transform="rotate(120 64 64)" />
				<circle class="initial-shell__nucleus" cx="64" cy="64" r="8" />
			</svg>
			<h1 class="initial-shell__title">Atomic Radius</h1>
			<p class="initial-shell__status">Loading your space...</p>
			<p class="initial-shell__fallback">Still working on the connection. You are on Atomic Radius.</p>
			<div class="initial-shell__links" aria-label="Status links">
				<a href="https://bsky.app/profile/atomicradius.app" target="_blank" rel="noopener noreferrer">Bluesky</a>
				<a href="https://x.com/atomicradiusapp" target="_blank" rel="noopener noreferrer">X</a>
			</div>
		</div>
	</div>
</div>
<noscript>
	<div class="initial-shell">
		<div class="initial-shell__content">
			<svg class="initial-shell__mark" viewBox="0 0 128 128" role="img" aria-label="Atomic Radius">
				<circle cx="64" cy="64" r="58" fill="#39D353" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" transform="rotate(60 64 64)" />
				<ellipse class="initial-shell__orbit" cx="64" cy="64" rx="43" ry="15" transform="rotate(120 64 64)" />
				<circle class="initial-shell__nucleus" cx="64" cy="64" r="8" />
			</svg>
			<h1 class="initial-shell__title">Atomic Radius</h1>
			<p class="initial-shell__status">JavaScript is required to use this application.</p>
		</div>
	</div>
</noscript>
</body>
</html>
