AWSTemplateFormatVersion: "2010-09-09"
Description: Atomic Radius ACM certificates with Route 53 DNS validation. Create in us-east-1 for ALB and CloudFront compatibility.

Parameters:
  ProjectName:
    Type: String
    Default: atomic-radius
    AllowedPattern: "^[a-z][a-z0-9-]*$"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z][a-z0-9-]*$"
  DomainName:
    Type: String
    Default: atomicradius.app
  HostedZoneId:
    Type: String

Resources:
  WildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  CertificateArn:
    Value: !Ref WildcardCertificate
  DomainName:
    Value: !Ref DomainName
