AWSTemplateFormatVersion: "2010-09-09"
Description: Atomic Radius CloudFront static CDN. This stack creates billable CDN resources when applied.

Parameters:
  ProjectName:
    Type: String
    Default: atomic-radius
    AllowedPattern: "^[a-z][a-z0-9-]*$"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z][a-z0-9-]*$"
  StaticBucketName:
    Type: String
  StaticDomainName:
    Type: String
    Default: ""
    Description: Optional custom CDN domain, such as static.atomicradius.app.
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional us-east-1 ACM certificate ARN for StaticDomainName.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref StaticDomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  StaticOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-static"
        Description: !Sub "${ProjectName} ${EnvironmentName} static S3 origin access"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${EnvironmentName} static CDN"
        Aliases: !If
          - HasCustomDomain
          - [!Ref StaticDomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: static-s3
            DomainName: !Sub "${StaticBucketName}.s3.${AWS::Region}.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref StaticOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: static-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${StaticBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${StaticDistribution}"

Outputs:
  StaticDistributionId:
    Value: !Ref StaticDistribution
  StaticDistributionDomainName:
    Value: !GetAtt StaticDistribution.DomainName
  StaticBucketName:
    Value: !Ref StaticBucketName
